# Construye y publica la imagen del servidor MCP en GHCR cuando cambia su código.
# El temario no está en la imagen: el servidor lo lee de GitHub, así que un cambio de
# contenido no necesita imagen nueva. El despliegue en alala lo hace el repo de kademy.
name: Imagen del servidor MCP

on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/mcp-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcp
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/icalvete/beakman-gems/mcp:latest
            ghcr.io/icalvete/beakman-gems/mcp:${{ github.sha }}
