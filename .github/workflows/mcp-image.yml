# Construye y publica la imagen del servidor MCP en GHCR cuando cambia su código o las webs (docs/ y lab/site/).
# El temario no está en la imagen: el servidor lo lee de GitHub, así que un cambio de
# contenido no necesita imagen nueva. El despliegue en alala lo hace el repo de kademy.
name: Imagen del servidor MCP

on:
  push:
    branches: [main]
    paths: ["mcp/**", "docs/**", "lab/site/**", ".github/workflows/mcp-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Antes de construir: que el cambio no rompa los conectores ya añadidos en claude.ai (ver CLAUDE.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp/requirements.txt && python3 scripts/check_contract.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/icalvete/beakman-mcp:latest
            ghcr.io/icalvete/beakman-mcp:${{ github.sha }}
