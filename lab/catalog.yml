# Catálogo del laboratorio de Beakman (lab.beakman.kademy.net).
# build.py genera con él la portada de cada idioma y la página de cada asignatura.
# Cada recurso lleva, por idioma: título, temas, descripción, objetivo (para qué sirve) y método (cómo lo hace).
# Un recurso nuevo: su carpeta en lab/<id>/ (código) y su página en site/<idioma>/<asignatura>/<curso>/<id>/,
# más una entrada aquí. Los textos van por idioma; un recurso sin un idioma no sale en ese idioma.
# tipo (opcional): resumen. Lleva su pastilla y sale el primero de su curso, porque es lo primero que se lee de un tema.

idiomas: [es]          # idiomas publicados; el primero es el de por defecto

cursos: [1eso, 2eso]

asignaturas:
  # color: la etiqueta de la asignatura en cada recurso y la sombra de su tarjeta. Tonos claros: el texto va en tinta oscura.
  - id: historia
    foto: historia.jpg
    color: "#FFD43B"
    es: {slug: historia, nombre: Historia, lema: "Cuándo y dónde, sí. Pero sobre todo por qué pasó, a quién le cambió la vida y qué queda hoy."}
    en: {slug: history, nombre: History, lema: "When and where, yes. But above all why it happened, whose lives it changed and what is left today."}
  - id: matematicas
    foto: matematicas.jpg
    color: "#74C0FC"
    es: {slug: matematicas, nombre: Matemáticas, lema: "El porqué de cada paso."}
    en: {slug: maths, nombre: Maths, lema: "The why behind every step."}
  - id: ciencias
    foto: ciencias.webp
    color: "#69DB7C"
    es: {slug: ciencias, nombre: Ciencias, lema: "Mirar el mundo y preguntarle cosas."}
    en: {slug: science, nombre: Science, lema: "Look at the world and ask it questions."}
  - id: lengua
    foto: lengua.webp
    color: "#FF8787"
    es: {slug: lengua, nombre: Lengua y Literatura, lema: "Entender lo que lees y decir lo que piensas."}
    en: {slug: language, nombre: Language and Literature, lema: "Understand what you read, say what you think."}

recursos:
  - id: resumen-tema-1
    asignatura: historia
    curso: 2eso
    tipo: resumen
    imagen: resumen-tema-1.jpg
    es:
      titulo: El Tema 1 contado como una historia
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        El tema entero en una lectura: del fin de Roma al reino nazarí de Granada, apartado por apartado, contado
        como una cadena de qué provocó qué.
      objetivo: >-
        Entender las causas antes de memorizar: cómo se relacionan la economía, la política, la religión y la cultura,
        y por qué pasó cada cosa.
      metodo: >-
        Cada apartado termina con la idea que hay que guardar y enlaza al recurso del lab para practicarlo. Al final,
        las cinco relaciones que responden casi cualquier «¿por qué…?» del examen.

  - id: ponte-a-prueba-tema-1
    asignatura: historia
    curso: 2eso
    imagen: ponte-a-prueba-tema-1.jpg
    solo_pc: true
    es:
      titulo: "Ponte a prueba: el inicio de la Edad Media"
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Repaso para el examen: las 12 preguntas del tema, conceptos, ordenar los hechos, causas y cuadros
        para completar, con las respuestas de Beakman y un simulacro de examen para hacer con él en Claude.
      objetivo: >-
        Fijar el tema recordando sin mirar, que es lo que de verdad se queda, y saber qué partes faltan por
        repasar antes del examen.
      metodo: >-
        Práctica de recuperación: primero contestas tú y luego comparas. Marcas cada pregunta como sabida, a
        medias o no sabida, y vuelves solo a las que fallan. Sigue el Tema 1 de Vicens Vives (Madrid).

  - id: cronomapa-edad-media
    asignatura: historia
    curso: 2eso
    imagen: cronomapa-edad-media.jpg
    solo_pc: true
    es:
      titulo: Cronomapa de la Edad Media
      temas: Toda la Edad Media
      descripcion: >-
        Mueve la barra del 476 al 1492 y mira qué reinos, ciudades y batallas coincidieron en el tiempo.
        Cada acontecimiento cuenta qué cambió, al poco y a la larga.
      objetivo: >-
        Ver qué existía a la vez, que es lo que más cuesta de la Edad Media. Situar cada reino, ciudad y batalla
        en el mapa y en el tiempo, y entender cómo un acontecimiento lleva al siguiente.
      metodo: >-
        Aprender explorando: el tiempo lo mueves tú. En diez paradas Beakman te hace una pregunta para pensar
        antes de ver la pista. Cada acontecimiento explica sus consecuencias en la gente, la política, el arte y la
        cultura, y las palabras difíciles tienen su explicación al pasar el ratón.

  - id: mapas-al-andalus
    asignatura: historia
    curso: 2eso
    imagen: mapas-al-andalus.jpg
    solo_pc: true
    es:
      titulo: Los mapas de al-Ándalus
      temas: Tema 1 · Al-Ándalus
      descripcion: >-
        Casi 800 años en seis mapas: la conquista, el emirato, el califato, los taifas, almorávides y almohades,
        y el reino nazarí de Granada.
      objetivo: >-
        Entender cómo se formó y cómo fue encogiendo al-Ándalus, y qué causas explican cada cambio.
      metodo: >-
        Antes de pasar de un mapa al siguiente, Beakman pregunta qué pasó entre los dos. Al final, un juego:
        reconocer cada etapa en un mapa sin nombres.

  - id: palabras-del-arabe
    asignatura: historia
    curso: 2eso
    imagen: palabras-del-arabe.jpg
    solo_pc: true
    es:
      titulo: ¿Qué dicen las palabras?
      temas: Tema 1 · El legado de al-Ándalus
      descripcion: >-
        Un juego con las palabras que el español heredó del árabe: descubre cuáles vienen de al-Ándalus y
        cuáles solo lo parecen, clasifícalas por ámbitos y averigua por qué tantas empiezan por «al».
      objetivo: >-
        Resolver el reto del tema («¿Qué dicen las palabras sobre nuestro legado andalusí?») y saber explicar
        el legado de al-Ándalus: regadío y cultivos nuevos, comercio y ciencia.
      metodo: >-
        Tarjetas de sí o no con el origen de cada palabra, clasificación con corrección, un mini reto sobre el
        artículo «al» y la conclusión de Beakman.

  - id: me-pongo-en-su-mentalidad
    asignatura: historia
    curso: 2eso
    imagen: me-pongo-en-su-mentalidad.jpg
    solo_pc: true
    es:
      titulo: Me pongo en su mentalidad
      temas: Tema 1 · Del fin de Roma al Califato de Córdoba
      descripcion: >-
        Seis personas del inicio de la Edad Media: un artesano que huye al campo, una comerciante de
        Constantinopla, un monje copista, una vecina de Toledo en el 711, un mercader del zoco de Córdoba y
        una campesina de una alquería. Elige una y escribe en su piel.
      objetivo: >-
        Practicar la actividad «Me pongo en su mentalidad» del libro: usar datos ciertos de la época para
        imaginar qué veía, qué temía y qué le importaba a alguien que vivió entonces.
      metodo: >-
        Situación, tres preguntas guía y una chuleta de datos; el texto se guarda en el ordenador y un botón lo
        copia para que Beakman lo revise en Claude, con una persona adulta al lado.

  - id: mezquita-y-alqueria
    asignatura: historia
    curso: 2eso
    imagen: mezquita-y-alqueria.jpg
    solo_pc: true
    es:
      titulo: La mezquita y la alquería por dentro
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Dos dibujos para pulsar: las partes de una mezquita (minarete, patio, fuente, sala de oraciones, quibla,
        mihrab y mimbar) y las de una alquería de regadío (rueda hidráulica, noria, acequias, alberca, huertos…).
        Con los cinco deberes del musulmán.
      objetivo: >-
        Reconocer cada parte de la mezquita y de la alquería y saber para qué servía, sin confundir la quibla con
        el mihrab.
      metodo: >-
        Primero exploras: pulsas cada parte y lees qué es. Después, en «Ponte a prueba», se ocultan las etiquetas
        y tienes que encontrar cada parte. Y tres trampas típicas del examen.

  - id: mayrit
    asignatura: historia
    curso: 2eso
    imagen: mayrit.jpg
    solo_pc: true
    es:
      titulo: Mayrit, el Madrid de al-Ándalus
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Un plano para pulsar de la fortaleza andalusí que dio origen a Madrid, con una capa que superpone el Madrid
        de hoy, una línea de tiempo y un paseo por lo que queda.
      objetivo: >-
        Saber quién fundó Mayrit, para qué y cómo era, y reconocer en el Madrid de hoy dónde estaban el alcázar, la
        muralla y la mezquita.
      metodo: >-
        Exploras el plano parte a parte, cambias a «Madrid de hoy» para comparar, repasas la línea de tiempo y
        terminas con un mini reto de cinco preguntas con corrección.

  - id: quien-soy
    asignatura: historia
    curso: 2eso
    imagen: quien-soy.jpg
    solo_pc: true
    es:
      titulo: ¿Quién soy?
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Trece personajes del inicio de la Edad Media te hablan en primera persona: de Rómulo Augústulo a Almanzor.
        Adivina quién es con el menor número de pistas.
      objetivo: >-
        Poner cara, fecha y lugar a los protagonistas del tema y entender por qué importa cada uno: quién cerró el
        Imperio de Occidente, quién unió a visigodos e hispanorromanos, quién creó el emirato y el califato.
      metodo: >-
        Pistas de la más difícil a la más fácil: cuantas menos uses, más puntos. Eliges entre opciones o escribes el
        nombre. Al acertar ves su ficha y al final repites solo los que fallaste.

  - id: vocabulario-tema-1
    asignatura: historia
    curso: 2eso
    imagen: vocabulario-tema-1.jpg
    solo_pc: true
    es:
      titulo: Vocabulario del Tema 1
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Las 47 palabras clave del tema en tarjetas que giran: de Mare Nostrum y basileus a taifa, alquería y Mayrit,
        con su definición y un ejemplo.
      objetivo: >-
        Saber definir con tus palabras los términos que caen en el examen, apartado por apartado, y llegar al día del
        examen con todos dominados.
      metodo: >-
        Repaso espaciado con cajas: lo que sabes sale cada vez menos y lo que fallas vuelve enseguida. Filtro por
        apartado, contador de dominadas y un examen rápido en el que escribes la definición y la comparas.

  - id: tres-carriles
    asignatura: historia
    curso: 2eso
    imagen: tres-carriles.jpg
    solo_pc: true
    es:
      titulo: El Tema 1 en tres carriles
      temas: Tema 1 · La huella andalusí
      descripcion: >-
        Una línea del tiempo del 400 al 1500 con tres carriles en paralelo: Imperio bizantino, Europa germánica y
        carolingia, y el islam y al-Ándalus. Cabe en un folio para imprimir.
      objetivo: >-
        Ver qué pasaba a la vez en las tres civilizaciones del Mediterráneo, que es lo que más cuesta del tema, y
        situar cada fecha clave en su etapa.
      metodo: >-
        Una regla que mueves tú corta los tres carriles y te cuenta qué existía en ese año y qué pasó cerca. En papel,
        un A4 apaisado para tenerlo delante al estudiar.
