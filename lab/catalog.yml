# Catálogo del laboratorio de Beakman (lab.beakman.kademy.net).
# build.py genera con él la portada de cada idioma y la página de cada asignatura.
# Cada recurso lleva, por idioma: título, unidad, descripción, objetivo (para qué sirve) y método (cómo lo hace).
# Un recurso nuevo: su carpeta en lab/<id>/ (código) y su página en site/<idioma>/<asignatura>/<curso>/<id>/,
# más una entrada aquí. Los textos van por idioma; un recurso sin un idioma no sale en ese idioma.
# unidad: el tema al que pertenece; con el curso y la materia forma la etiqueta de cada tarjeta (temas: solo para
# «Para todo el curso», qué abarca); agrupa los recursos en la página de la asignatura («Para todo el curso» va al final).
# tipo (opcional): resumen. Lleva su pastilla y sale el primero de su curso, porque es lo primero que se lee de un tema.

idiomas: [es]          # idiomas publicados; el primero es el de por defecto

cursos: [1eso, 2eso]

asignaturas:
  # materias: el nombre de la materia en el libro de cada curso; va en la etiqueta de cada recurso.
  # Un recurso puede llevar la suya (materia:), p. ej. Biología y Geología en 2º, que según la comunidad toca en vez de FyQ.
  # color: la etiqueta de la asignatura en cada recurso y la sombra de su tarjeta. Tonos claros: el texto va en tinta oscura.
  - id: historia
    foto: historia.jpg
    color: "#FFD43B"
    es: {slug: historia, nombre: Historia, materias: {1eso: Geografía e Historia, 2eso: Geografía e Historia}, lema: "Cuándo y dónde, sí. Pero sobre todo por qué pasó, a quién le cambió la vida y qué queda hoy."}
    en: {slug: history, nombre: History, lema: "When and where, yes. But above all why it happened, whose lives it changed and what is left today."}
  - id: matematicas
    foto: matematicas.jpg
    color: "#74C0FC"
    es: {slug: matematicas, nombre: Matemáticas, lema: "El porqué de cada paso."}
    en: {slug: maths, nombre: Maths, lema: "The why behind every step."}
  - id: ciencias
    foto: ciencias.webp
    color: "#69DB7C"
    es: {slug: ciencias, nombre: Ciencias, materias: {1eso: Biología y Geología, 2eso: Física y Química}, lema: "Mirar el mundo y preguntarle cosas."}
    en: {slug: science, nombre: Science, lema: "Look at the world and ask it questions."}
  - id: lengua
    foto: lengua.webp
    color: "#FF8787"
    es: {slug: lengua, nombre: Lengua y Literatura, lema: "Entender lo que lees y decir lo que piensas."}
    en: {slug: language, nombre: Language and Literature, lema: "Understand what you read, say what you think."}

recursos:
  - id: resumen-tema-1
    asignatura: historia
    curso: 2eso
    tipo: resumen
    imagen: resumen-tema-1.jpg
    es:
      titulo: "Resumen del Tema 1: La huella andalusí"
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        El tema entero en una lectura: del fin de Roma al reino nazarí de Granada, apartado por apartado, contado
        como una cadena de qué provocó qué.
      objetivo: >-
        Entender las causas antes de memorizar: cómo se relacionan la economía, la política, la religión y la cultura,
        y por qué pasó cada cosa.
      metodo: >-
        Cada apartado termina con la idea que hay que guardar y enlaza al recurso del lab para practicarlo. Al final,
        las cinco relaciones que responden casi cualquier «¿por qué…?» del examen.

  - id: ponte-a-prueba-tema-1
    asignatura: historia
    curso: 2eso
    imagen: ponte-a-prueba-tema-1.jpg
    solo_pc: true
    es:
      titulo: "Ponte a prueba: el inicio de la Edad Media"
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Repaso para el examen: las 12 preguntas del tema, conceptos, ordenar los hechos, causas y cuadros
        para completar, con las respuestas de Beakman y un simulacro de examen para hacer con él en Claude.
      objetivo: >-
        Fijar el tema recordando sin mirar, que es lo que de verdad se queda, y saber qué partes faltan por
        repasar antes del examen.
      metodo: >-
        Práctica de recuperación: primero contestas tú y luego comparas. Marcas cada pregunta como sabida, a
        medias o no sabida, y vuelves solo a las que fallan. Sigue el Tema 1 de 2º de la Comunidad de Madrid.

  - id: cronomapa-edad-media
    asignatura: historia
    curso: 2eso
    imagen: cronomapa-edad-media.jpg
    solo_pc: true
    es:
      titulo: Cronomapa de la Edad Media
      temas: Toda la Edad Media
      unidad: Para todo el curso
      descripcion: >-
        Mueve la barra del 476 al 1492 y mira qué reinos, ciudades y batallas coincidieron en el tiempo.
        Cada acontecimiento cuenta qué cambió, al poco y a la larga.
      objetivo: >-
        Ver qué existía a la vez, que es lo que más cuesta de la Edad Media. Situar cada reino, ciudad y batalla
        en el mapa y en el tiempo, y entender cómo un acontecimiento lleva al siguiente.
      metodo: >-
        Aprender explorando: el tiempo lo mueves tú. En diez paradas Beakman te hace una pregunta para pensar
        antes de ver la pista. Cada acontecimiento explica sus consecuencias en la gente, la política, el arte y la
        cultura, y las palabras difíciles tienen su explicación al pasar el ratón.

  - id: mapas-al-andalus
    asignatura: historia
    curso: 2eso
    imagen: mapas-al-andalus.jpg
    solo_pc: true
    es:
      titulo: Los mapas de al-Ándalus
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Casi 800 años en seis mapas: la conquista, el emirato, el califato, los taifas, almorávides y almohades,
        y el reino nazarí de Granada.
      objetivo: >-
        Entender cómo se formó y cómo fue encogiendo al-Ándalus, y qué causas explican cada cambio.
      metodo: >-
        Antes de pasar de un mapa al siguiente, Beakman pregunta qué pasó entre los dos. Al final, un juego:
        reconocer cada etapa en un mapa sin nombres.

  - id: palabras-del-arabe
    asignatura: historia
    curso: 2eso
    imagen: palabras-del-arabe.jpg
    solo_pc: true
    es:
      titulo: ¿Qué dicen las palabras?
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Un juego con las palabras que el español heredó del árabe: descubre cuáles vienen de al-Ándalus y
        cuáles solo lo parecen, clasifícalas por ámbitos y averigua por qué tantas empiezan por «al».
      objetivo: >-
        Resolver el reto del tema («¿Qué dicen las palabras sobre nuestro legado andalusí?») y saber explicar
        el legado de al-Ándalus: regadío y cultivos nuevos, comercio y ciencia.
      metodo: >-
        Tarjetas de sí o no con el origen de cada palabra, clasificación con corrección, un mini reto sobre el
        artículo «al» y la conclusión de Beakman.

  - id: me-pongo-en-su-mentalidad
    asignatura: historia
    curso: 2eso
    imagen: me-pongo-en-su-mentalidad.jpg
    solo_pc: true
    es:
      titulo: Me pongo en su mentalidad
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Seis personas del inicio de la Edad Media: un artesano que huye al campo, una comerciante de
        Constantinopla, un monje copista, una vecina de Toledo en el 711, un mercader del zoco de Córdoba y
        una campesina de una alquería. Elige una y escribe en su piel.
      objetivo: >-
        Practicar la actividad «Me pongo en su mentalidad» del libro: usar datos ciertos de la época para
        imaginar qué veía, qué temía y qué le importaba a alguien que vivió entonces.
      metodo: >-
        Situación, tres preguntas guía y una chuleta de datos; el texto se guarda en el ordenador y un botón lo
        copia para que Beakman lo revise en Claude, con una persona adulta al lado.

  - id: mezquita-y-alqueria
    asignatura: historia
    curso: 2eso
    imagen: mezquita-y-alqueria.jpg
    solo_pc: true
    es:
      titulo: La mezquita y la alquería por dentro
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Dos dibujos para pulsar: las partes de una mezquita (minarete, patio, fuente, sala de oraciones, quibla,
        mihrab y mimbar) y las de una alquería de regadío (rueda hidráulica, noria, acequias, alberca, huertos…).
        Con los cinco deberes del musulmán.
      objetivo: >-
        Reconocer cada parte de la mezquita y de la alquería y saber para qué servía, sin confundir la quibla con
        el mihrab.
      metodo: >-
        Primero exploras: pulsas cada parte y lees qué es. Después, en «Ponte a prueba», se ocultan las etiquetas
        y tienes que encontrar cada parte. Y tres trampas típicas del examen.

  - id: mayrit
    asignatura: historia
    curso: 2eso
    imagen: mayrit.jpg
    solo_pc: true
    es:
      titulo: Mayrit, el Madrid de al-Ándalus
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Un plano para pulsar de la fortaleza andalusí que dio origen a Madrid, con una capa que superpone el Madrid
        de hoy, una línea de tiempo y un paseo por lo que queda.
      objetivo: >-
        Saber quién fundó Mayrit, para qué y cómo era, y reconocer en el Madrid de hoy dónde estaban el alcázar, la
        muralla y la mezquita.
      metodo: >-
        Exploras el plano parte a parte, cambias a «Madrid de hoy» para comparar, repasas la línea de tiempo y
        terminas con un mini reto de cinco preguntas con corrección.

  - id: quien-soy
    asignatura: historia
    curso: 2eso
    imagen: quien-soy.jpg
    solo_pc: true
    es:
      titulo: ¿Quién soy?
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Trece personajes del inicio de la Edad Media te hablan en primera persona: de Rómulo Augústulo a Almanzor.
        Adivina quién es con el menor número de pistas.
      objetivo: >-
        Poner cara, fecha y lugar a los protagonistas del tema y entender por qué importa cada uno: quién cerró el
        Imperio de Occidente, quién unió a visigodos e hispanorromanos, quién creó el emirato y el califato.
      metodo: >-
        Pistas de la más difícil a la más fácil: cuantas menos uses, más puntos. Eliges entre opciones o escribes el
        nombre. Al acertar ves su ficha y al final repites solo los que fallaste.

  - id: vocabulario-tema-1
    asignatura: historia
    curso: 2eso
    imagen: vocabulario-tema-1.jpg
    solo_pc: true
    es:
      titulo: Vocabulario del Tema 1
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Las 47 palabras clave del tema en tarjetas que giran: de Mare Nostrum y basileus a taifa, alquería y Mayrit,
        con su definición y un ejemplo.
      objetivo: >-
        Saber definir con tus palabras los términos que caen en el examen, apartado por apartado, y llegar al día del
        examen con todos dominados.
      metodo: >-
        Repaso espaciado con cajas: lo que sabes sale cada vez menos y lo que fallas vuelve enseguida. Filtro por
        apartado, contador de dominadas y un examen rápido en el que escribes la definición y la comparas.

  - id: tres-carriles
    asignatura: historia
    curso: 2eso
    imagen: tres-carriles.jpg
    solo_pc: true
    es:
      titulo: El Tema 1 en tres carriles
      unidad: Tema 1 · La huella andalusí
      descripcion: >-
        Una línea del tiempo del 400 al 1500 con tres carriles en paralelo: Imperio bizantino, Europa germánica y
        carolingia, y el islam y al-Ándalus. Cabe en un folio para imprimir.
      objetivo: >-
        Ver qué pasaba a la vez en las tres civilizaciones del Mediterráneo, que es lo que más cuesta del tema, y
        situar cada fecha clave en su etapa.
      metodo: >-
        Una regla que mueves tú corta los tres carriles y te cuenta qué existía en ese año y qué pasó cerca. En papel,
        un A4 apaisado para tenerlo delante al estudiar.

  - id: resumen-actividad-cientifica
    asignatura: ciencias
    curso: 2eso
    tipo: resumen
    imagen: resumen-actividad-cientifica.jpg
    es:
      titulo: "Resumen del Tema 1: La actividad científica"
      unidad: Tema 1 · La actividad científica
      descripcion: >-
        La unidad entera en una lectura: el método científico, las magnitudes, el Sistema Internacional, múltiplos y
        submúltiplos, el factor de conversión, medir bien y el laboratorio.
      objetivo: >-
        Tener claro lo esencial antes de practicar: qué es medir, con qué unidades y cómo se cambia de una a otra, y por
        qué ninguna medida es perfecta.
      metodo: >-
        Siete apartados cortos, cada uno con la idea que hay que guardar y el recurso del lab para practicarlo, y al
        final las cinco claves del examen.

  - id: que-es-una-magnitud
    asignatura: ciencias
    curso: 2eso
    imagen: que-es-una-magnitud.jpg
    solo_pc: true
    es:
      titulo: ¿Qué es una magnitud?
      unidad: Tema 1 · La actividad científica
      descripcion: >-
        Clasifica qué se puede medir y qué no, mira a escala por qué «5» no dice nada y «5 m» sí, empareja cada
        magnitud con su unidad, su símbolo y su instrumento, y construye las magnitudes derivadas con bloques.
      objetivo: >-
        Entender de verdad qué es una magnitud, por qué una medida siempre lleva número y unidad, qué son el Sistema
        Internacional y sus siete magnitudes básicas, y cómo salen de ellas la superficie, el volumen, la velocidad y la
        densidad.
      metodo: >-
        Hacer antes que leer: tarjetas con respuesta al momento, dibujos a escala, una tabla con las trampas típicas
        (Kg, seg, °K) explicadas y un constructor de recetas que enseña la unidad mientras la montas. Al final, diez
        preguntas y repetir solo las falladas.

  - id: escalera-de-unidades
    asignatura: ciencias
    curso: 2eso
    imagen: escalera-de-unidades.jpg
    solo_pc: true
    es:
      titulo: La escalera de las unidades
      unidad: Tema 1 · La actividad científica
      descripcion: >-
        Sube y baja la escalera de km a mm (y de las unidades de masa y de capacidad), mira cómo se mueve la coma en
        cada escalón y aprende el truco del factor de conversión, con las unidades tachándose ante tus ojos.
      objetivo: >-
        Cambiar de unidad sin miedo y sin memorizar: entender los múltiplos y submúltiplos, por qué cada escalón es
        un ×10 o un ÷10, y cómo funciona el factor de conversión, también con km/h y m/s.
      metodo: >-
        Una escalera animada que hace la cuenta en cada paso, ejemplos guiados del factor de conversión, superficie y
        volumen con cuadraditos y cubitos, y un generador de ejercicios con la corrección paso a paso.

  - id: mide-como-en-el-laboratorio
    asignatura: ciencias
    curso: 2eso
    imagen: mide-como-en-el-laboratorio.jpg
    solo_pc: true
    es:
      titulo: Mide como en el laboratorio
      unidad: Tema 1 · La actividad científica
      descripcion: >-
        Lee una regla, una probeta, un termómetro, una balanza y un cronómetro, compara la precisión de dos
        instrumentos, mide varias veces y haz la media, y caza los errores típicos al medir.
      objetivo: >-
        Saber medir bien: leer cada instrumento, escribir siempre número y unidad, entender qué es la precisión y por
        qué en ciencia se repite una medida y se hace la media.
      metodo: >-
        Instrumentos dibujados que cambian cada vez, corrección con margen de media división, un juego de reflejos
        para medir tiempos cinco veces y casos para descubrir qué ha hecho mal quien mide.

  - id: resumen-propiedades-materia
    asignatura: ciencias
    curso: 2eso
    tipo: resumen
    imagen: resumen-propiedades-materia.jpg
    es:
      titulo: "Resumen del Tema 2: Propiedades de la materia"
      unidad: Tema 2 · Propiedades de la materia
      descripcion: >-
        La unidad entera en una lectura: masa, volumen y densidad, por qué algo flota, los tres estados, la teoría
        cinético-molecular, los cambios de estado y la gráfica de calentamiento.
      objetivo: >-
        Tener claro lo esencial antes de practicar: qué propiedades identifican una sustancia, cómo se calcula la
        densidad y qué hacen las partículas en cada estado y al cambiar de uno a otro.
      metodo: >-
        Ocho apartados cortos, cada uno con la idea que hay que guardar y el recurso del lab para practicarlo, y al
        final las 5 claves del examen.

  - id: flota-o-se-hunde
    asignatura: ciencias
    curso: 2eso
    imagen: flota-o-se-hunde.jpg
    solo_pc: true
    es:
      titulo: ¿Flota o se hunde? La densidad
      unidad: Tema 2 · Propiedades de la materia
      descripcion: >-
        Pesa objetos en una balanza, sumérgelos en una probeta y lee el menisco, calcula su densidad con las unidades
        bien escritas y suéltalos en agua, agua con sal, aceite o mercurio para ver si flotan. Y desmonta las trampas:
        el kilo de hierro y el de paja, y el barco de acero que flota.
      objetivo: >-
        Entender de verdad qué son la masa, el volumen y la densidad, por qué la densidad sirve para reconocer una
        sustancia y no cambia al partir el objeto, y por qué algo flota cuando es menos denso que el líquido.
      metodo: >-
        Hacer antes que leer: tarjetas con respuesta al momento, un laboratorio virtual que avisa de los errores típicos
        (el menisco, restar los volúmenes, dividir al revés), apostar antes de soltar cada objeto, dibujos a escala y un
        barco cuyo casco agrandas tú. Al final, diez preguntas y repetir solo las falladas.

  - id: particulas-en-movimiento
    asignatura: ciencias
    curso: 2eso
    imagen: particulas-en-movimiento.jpg
    solo_pc: true
    es:
      titulo: Las partículas en movimiento
      unidad: Tema 2 · Propiedades de la materia
      descripcion: >-
        Calienta y enfría una caja de partículas y mira cómo pasan de vibrar a deslizarse y a volar, aprieta un gas en
        una jeringuilla contando sus choques contra el émbolo y explica con partículas la colonia, el colorante, la
        rueda de la bici o el vaso que suda.
      objetivo: >-
        Entender la teoría cinético-molecular y usarla para explicar cómo se comporta cada estado: por qué un gas se
        comprime y un líquido no, qué es la presión y por qué las partículas nunca cambian de tamaño ni se paran.
      metodo: >-
        Ver antes que leer: una simulación con termómetro, las cuatro ideas de la teoría conectadas cada una con algo
        que se ve en la caja y una jeringuilla con contador de choques y tabla para descubrir la ley de Boyle. Al final,
        diez situaciones de la vida diaria con el porqué de cada opción y repetir solo las falladas.

  - id: cambios-de-estado
    asignatura: ciencias
    curso: 2eso
    imagen: cambios-de-estado.jpg
    solo_pc: true
    es:
      titulo: Los cambios de estado y la gráfica de calentamiento
      unidad: Tema 2 · Propiedades de la materia
      descripcion: >-
        Pon nombre a las seis flechas entre sólido, líquido y gas, calienta hielo en un hornillo virtual mientras se
        dibuja su gráfica en directo y lee las gráficas de otras sustancias para descubrir cuál es cada una.
      objetivo: >-
        Dominar los nombres de los cambios de estado y saber cuáles absorben o ceden energía, y leer e interpretar
        una gráfica de calentamiento y de enfriamiento: los tramos, las mesetas, por qué en ellas no sube la
        temperatura y qué dicen del punto de fusión y de ebullición.
      metodo: >-
        Hacer antes que leer: un triángulo para completar con respuesta al momento, un experimento con el vaso, el
        termómetro y una lupa de partículas junto a la gráfica, once gráficas con datos reales para leer (también
        una mezcla sin meseta) y la trampa del «humo» blanco de la olla.
